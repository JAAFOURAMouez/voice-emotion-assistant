[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "voxemo"
version = "0.1.0"
description = "Assistant vocal local qui adapte ses réponses aux indices vocaux d'émotion."
readme = "README.md"
requires-python = ">=3.11"
# Les dépendances sont listées (et versionnées) dans requirements.txt,
# qui installe aussi ce paquet en mode éditable.
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers -m 'not integration'"
markers = [
    "integration: real models, microphone or Ollama required (run with -m integration)",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF"]
# Typographie française et apostrophes typographiques volontaires.
allowed-confusables = ["–", "’", "´"]

[tool.ruff.format]
quote-style = "double"
